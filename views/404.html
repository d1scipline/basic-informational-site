<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZenFo</title>
    <style>
      /* 1. Use a more-intuitive box-sizing model */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /* 2. Remove default margin */
      *:not(dialog) {
        margin: 0;
      }

      /* 3. Enable keyword animations */
      @media (prefers-reduced-motion: no-preference) {
        html {
          interpolate-size: allow-keywords;
        }
      }

      body {
        /* 4. Increase line-height */
        line-height: 1.5;
        /* 5. Improve text rendering */
        -webkit-font-smoothing: antialiased;
      }

      /* 6. Improve media defaults */
      img,
      picture,
      video,
      canvas,
      svg {
        display: block;
        max-width: 100%;
      }

      /* 7. Inherit fonts for form controls */
      input,
      button,
      textarea,
      select {
        font: inherit;
      }

      /* 8. Avoid text overflows */
      p,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        overflow-wrap: break-word;
      }

      /* 9. Improve line wrapping */
      p {
        text-wrap: pretty;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        text-wrap: balance;
      }

      /*
  10. Create a root stacking context
*/
      #root,
      #__next {
        isolation: isolate;
      }

      * {
        font-family: sans-serif;
      }
      html {
        display: flex;
        justify-content: center;
        min-height: 100%;
      }
      body {
        width: min(80%, 900px);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* Navbar styling */
      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 20px;
        padding-bottom: 20px;
      }

      h1 {
        color: rgb(0, 98, 255);
      }

      a {
        all: unset;
        color: gray;
        transition: color 0.15s;
      }

      a:hover {
        cursor: pointer;
        color: rgb(0, 191, 255);
      }

      .nav-bar {
        display: flex;
        gap: 9px;
        justify-content: center;
        align-items: center;
        font-size: 18px;
      }

      @media (max-width: 768px) {
        nav {
          font-size: 8px;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <h1>ZenFo</h1>
      <div class="nav-bar">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/contact-me">Contact</a>
      </div>
    </nav>
    <h2>404 Not Found</h2>
  </body>
</html>
